name: PR Checks

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
        types: [opened, synchronize, reopened, ready_for_review]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    NEXT_SUPABASE_URL: http://localhost:54321
    NEXT_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    NEXT_SUPABASE_SERVICE_ROLE_KEY: test-service-key
    NEXT_UPDATE_TICKERS_SECRET_KEY: test-secret-key
    ENABLE_BANKING_APP_ID: test-app-id
    ENABLE_BANKING_ASPSP_NAME: test-aspsp-name
    ENABLE_BANKING_PRIVATE_KEY: test-private-key
    ENABLE_BANKING_ASPSP_COUNTRY: test-aspsp-country
    NEXT_SYNC_BANK_SECRET_KEY: test-sync-bank-secret-key

jobs:
    lint:
        name: Lint & Knip
        if: github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/setup
            - run: node --run lint
            - run: node --run knip

    unit:
        name: Unit Tests
        if: github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/setup
            - run: node --run test

    build:
        name: Build & Typecheck
        if: github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/setup
            - uses: actions/cache@v6
              with:
                  path: .next/cache
                  key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
                  restore-keys: |
                      ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            - run: node --run build
            - run: node --run typecheck
